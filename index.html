<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="مدیریت و مطالعه‌ی کتاب‌ها و فصل‌ها">
<title>کتابخانه‌ی کتاب‌ها</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#141414;--line:#30263c;--text:#f1f1f1;--muted:#a5a5a5;--purple:#bb86fc;--blue:#5aa9ff;--green:#56c987;--reader-size:20px;--reader-line:1.95}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px max(15px,env(safe-area-inset-right)) 11px max(15px,env(safe-area-inset-left));background:#090909;border-bottom:1px solid #211b29}.topbar h1{font-size:16px;font-weight:600;margin:0}.top-actions{display:flex;gap:7px}.wrap{width:min(860px,100%);margin:auto;padding:17px 15px 65px}.button{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);min-height:39px;padding:7px 11px}.button:hover{border-color:var(--purple)}.primary{background:var(--purple);border-color:var(--purple);color:#160e20;font-weight:700}.folder-row{padding:7px 0 12px;margin-bottom:14px;border-bottom:1px solid #211b29}.folder-row small{color:var(--muted);font-size:11px;line-height:1.6}.section-title{font-size:15px;font-weight:600;margin:3px 0 12px}.library-tools{display:flex;gap:8px;margin-bottom:10px}.library-tools input{width:100%;min-width:0;min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);outline:none}.library-tools input:focus{border-color:var(--purple)}.tag-filters{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tag-filters::-webkit-scrollbar{display:none}.tag-filter,.book-tag{white-space:nowrap;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--muted);padding:4px 10px;font-size:11px}.tag-filter.active{background:var(--purple);border-color:var(--purple);color:#160e20}.book-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:9px}.work-card{min-width:0;border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:7px}.book-open{display:block;width:100%;padding:0;border:0;background:none;color:var(--text);text-align:right}.book-open strong{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}.book-open small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.book-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;min-height:23px}.book-tag{padding:2px 8px;font-size:10px}.book-actions{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid #25212a}.reaction{display:flex;align-items:center;gap:4px;min-height:33px;padding:4px 7px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-size:10px}.reaction img{width:19px;height:19px;display:block}.reaction.selected{color:var(--purple);border-color:#47345b;background:#21182a}.edit-book{margin-right:auto;border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px}.edit-book:hover{color:var(--purple)}.empty{grid-column:1/-1;padding:23px 12px;color:var(--muted);font-size:13px;line-height:1.8;border:1px solid var(--line);text-align:center}
.backline{display:flex;align-items:center;gap:9px;margin-bottom:14px}.backline h2{font-size:16px;margin:0;flex:1}.chapter-card{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;padding:11px 9px;border:1px solid var(--line);border-radius:6px;background:#121212;color:var(--text);text-align:right;margin:7px 0}.chapter-dot{width:9px;height:9px;border-radius:50%;background:var(--purple)}.chapter-card.status-writing .chapter-dot,.status-writing .chapter-meter span{background:var(--blue)}.chapter-card.status-done .chapter-dot,.status-done .chapter-meter span{background:var(--green)}.chapter-detail{min-width:0}.chapter-name{font-size:13px}.chapter-meter{height:3px;background:#29252d;margin-top:6px}.chapter-meter span{display:block;height:100%;background:var(--purple)}.chapter-meta{color:var(--muted);font-size:10px;white-space:nowrap}.chapter-card.status-writing .chapter-meta{color:var(--blue)}.chapter-card.status-done .chapter-meta{color:var(--green)}
.reader-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}.reader-titles{flex:1;min-width:0;text-align:center}.reader-titles strong,.reader-titles small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader-titles strong{font-size:13px}.reader-titles small{font-size:10px;color:var(--muted)}.mode-tabs{display:flex;gap:4px}.mode-tabs button{min-height:34px;padding:5px 9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;font-size:12px}.mode-tabs button.active{border-color:var(--purple);color:var(--purple)}.editor{width:100%;min-height:56vh;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:6px;background:#111;color:var(--text);font-size:16px;line-height:1.9;outline:none}.editor:focus{border-color:var(--purple)}.reading-text{min-height:50vh;padding:10px 3px;color:var(--text);font-size:var(--reader-size);line-height:var(--reader-line);white-space:pre-wrap;overflow-wrap:anywhere}.read-area{max-width:720px;margin:auto}.reader-progress{height:3px;background:#26212b;margin:10px 0}.reader-progress span{display:block;height:100%;background:var(--blue)}.reader-progress span.done{background:var(--green)}.notice{margin:8px 0;color:var(--purple);font-size:12px}.reader-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:14px}.reader-bottom small{font-size:10px;color:var(--muted)}
.modal{width:min(440px,calc(100% - 24px));max-height:85vh;overflow:auto;padding:17px;border:1px solid var(--line);border-radius:8px;background:#141414;color:var(--text)}.modal::backdrop{background:#000b}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modal-head h2{font-size:16px;margin:0}.modal-close{border:0;background:transparent;color:var(--muted);padding:5px}.modal-form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#ddd}.field input{width:100%;min-height:41px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#090909;color:var(--text)}.modal-actions{display:flex;gap:7px;margin-top:5px}.toast{position:fixed;z-index:8;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.18s;background:#21182b;border:1px solid var(--purple);border-radius:6px;padding:9px 13px;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.topbar{padding-top:9px;padding-bottom:9px}.topbar h1{font-size:14px}.topbar .button{min-height:37px;padding:6px 9px;font-size:11px}.wrap{padding:14px 12px 50px}.book-list{grid-template-columns:1fr}.reader-head{gap:5px}.reader-head>.button{padding-inline:8px;min-height:35px;font-size:11px}.reader-titles{max-width:38%}.mode-tabs button{padding-inline:7px;font-size:11px}.reader-bottom .button{min-height:36px;padding:6px 8px;font-size:11px}.editor{min-height:58vh}}
body.reading-mode>.topbar{display:none}body.reader-mode>.topbar{display:none}.book-list{grid-template-columns:1fr;gap:5px}.work-card{padding:7px 9px}.book-open{display:flex;align-items:baseline;gap:7px;max-width:100%;white-space:nowrap}.book-open strong{flex:none;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-open small{flex:none;white-space:nowrap;margin:0;font-size:10px}.book-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:3px;min-width:0}.book-tags{display:flex;flex:1;min-width:0;gap:4px;flex-wrap:nowrap;overflow:hidden;margin:0;min-height:0}.book-tag{flex:none;padding:1px 7px;font-size:9px}.book-actions{flex:none;display:flex;gap:2px;margin:0;padding:0;border:0}.reaction{min-width:32px;min-height:32px;padding:5px;display:grid;place-items:center;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted)}.reaction img{width:19px;height:19px;display:block}.reaction.selected{color:var(--purple);border-color:#47345b;background:#21182a}.edit-book{display:none}.mode-toggle,.icon-action{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:7px}.mode-toggle{margin-inline-start:auto}.mode-toggle img,.icon-action img,.chapter-nav img{display:block;width:20px;height:20px}.reader-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px}.reader-bottom>#prevReaderChapter{justify-self:end}.reader-bottom>.reader-center{justify-self:center}.reader-bottom>#nextReaderChapter{justify-self:start}.chapter-nav{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:8px}.chapter-nav img{width:22px;height:22px}.chapter-nav span{display:none}.chapter-nav:disabled{opacity:.38;cursor:default}.reader-center{display:flex;align-items:center;justify-content:center;gap:7px;min-width:42px}.reader-center small{display:none}.icon-action{border-color:var(--purple);background:#21182b}.icon-action img{width:19px;height:19px}.icon-action.hidden{display:none!important}</style>
</head>
<body>
<header class="topbar"><h1 id="topTitle">کتابخانه‌ی کتاب‌ها</h1><div class="top-actions"><button class="button primary" id="addButton">افزودن کتاب</button></div></header>
<main>
<section class="page" id="page-dashboard"><div class="wrap"><div class="folder-row"><small id="folderStatus">برای افزودن کتاب، پوشه‌ی ذخیره‌سازی را انتخاب کن.</small></div><h2 class="section-title">کتاب‌ها</h2><div class="library-tools"><input id="bookSearch" type="search" placeholder="جست‌وجوی کتاب، نویسنده یا تگ" aria-label="جست‌وجوی کتاب‌ها"></div><div class="tag-filters" id="tagFilters"></div><div class="book-list" id="worksList"></div></div></section>
<section class="page hidden" id="page-chapters"><div class="wrap"><div class="backline"><button class="button" id="chapterBack">بازگشت</button><h2 id="chapterBookTitle"></h2><button class="button" id="editChapterBook">ویرایش</button></div><div class="subtle" id="chapterAuthor" style="font-size:12px;margin:-7px 0 15px"></div><div id="chapterList"></div></div></section>
<section class="page hidden" id="page-reader"><div class="wrap"><div class="reader-head"><button class="button" id="readerBack">فصل‌ها</button><div class="reader-titles"><strong id="readerBookTitle"></strong><small id="readerChapterTitle"></small></div><button class="mode-toggle" id="modeToggle" type="button" aria-label="رفتن به نوشتن" title="نوشتن"><img id="modeIcon" src="./icons/pencil.svg" alt=""></button></div><div id="writeNotice" class="notice hidden">برای این فصل هنوز متنی ذخیره نشده؛ متن فصل را بنویس.</div><div class="reader-progress"><span id="readerProgressFill"></span></div><div class="read-area" id="readArea"><article class="reading-text" id="readingText"></article></div><textarea class="editor hidden" id="chapterEditor" placeholder="متن فصل را اینجا بنویس…"></textarea><div class="reader-bottom"><button class="chapter-nav" id="prevReaderChapter" type="button" aria-label="فصل قبل"><img src="./icons/arrow-prev.svg" alt=""><span>قبل</span></button><div class="reader-center"><small id="readerPercent"></small><button class="icon-action hidden" id="saveText" type="button" aria-label="ذخیره‌ی متن" title="ذخیره‌ی متن"><img src="./icons/save.svg" alt=""></button></div><button class="chapter-nav" id="nextReaderChapter" type="button" aria-label="فصل بعد"><span>بعد</span><img src="./icons/arrow-next.svg" alt=""></button></div></div></section>
</main>
<dialog class="modal" id="appModal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="modal-close" id="modalClose" aria-label="بستن">بستن</button></div><div id="modalBody"></div></dialog><div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
